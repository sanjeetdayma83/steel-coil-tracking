name: steel_coil_tracking
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  excel: 3.0.0
  file_picker: 13.1.0
  flutter:
    sdk: flutter
  mobile_scanner: 7.4.2
  supabase_flutter: 2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/icon/
    - assets/logo/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0B1F3A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"


